
name: Deploy Next.js Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v6

      - name: Checkout portfolio source
        uses: actions/checkout@v6
        with:
          repository: Thilok-Reddy/my-next-app
          ref: main
          path: portfolio

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Build Next.js portfolio
        working-directory: portfolio
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio/out

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
